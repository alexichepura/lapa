[package]
name = "site"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.dev]
incremental = true
opt-level = 0
codegen-units = 256
debug = 0
lto = "off"
overflow-checks = false
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
# strip = "symbols"
[profile.wasm-release]
inherits = "release"
opt-level = 'z'

[workspace]
resolver = "2"
members = ["lib", "content", "image_config", "admin", "cli", "db", "e2e"]
# Keep `cargo build`/`test`/`clippy` at the root building only the root `site`
# package (the previous behaviour); the heavy e2e harness is built explicitly
# with `-p lapa-e2e` (see e2e/README.md).
default-members = ["."]

[workspace.dependencies]
cornucopia = { path = "./cornucopia" }
lib = { path = "./lib" }
content = { path = "./content" }
image_config = { path = "./image_config" }
db = { path = "./db" }
refinery = { version = "0.9", features = ["tokio-postgres"] }
axum = { version = "0.8", features = ["macros", "tracing"] }
axum-login = { version = "0.18", default-features = false }
tower-sessions = { version = "0.14", default-features = false }
bcrypt = { version = "0.19" }
cfg-if = "1"
chrono = { version = "0.4", features = ["serde"] }
config = "0.15.27"
console_error_panic_hook = "0.1"
cuid2 = "0.1.6"
deadpool-postgres = { version = "0.14.2", features = ["serde"] }
dotenvy = "0.15.7"
http = "1.5"
# image = { version = "0.25.6", features=["avif-native"] }
image = { version = "0.25.10", features=[] }
js-sys = { version = "0.3" }
leptos = { version = "0.8", features = ["nightly", "tracing"] }
leptoslate = { git = "https://github.com/alexichepura/leptoslate", rev = "ad7f8595a4a83da1fb33d499cfb98381fc87ee4c" }
leptoslate-rich = { git = "https://github.com/alexichepura/leptoslate", rev = "ad7f8595a4a83da1fb33d499cfb98381fc87ee4c" }
leptos_axum = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8", features = ["nightly"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6.5"
stylance = "0.8"
thiserror = "2"
tokio = { version = "1.53", features = ["macros"] }
time = "0.3"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "webpki-roots"] }
tower = { version = "0.5" }
tower_governor = { version = "0.8" }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["tracing-log", "env-filter"] }
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Blob",
    "File",
    "FileList",
    "FormData",
    "HtmlDialogElement",
    "HtmlDocument",
    "HtmlFormElement",
    "HtmlInputElement",
    "Url",
] }

[dependencies]
cornucopia = { workspace = true, optional = true }
content.workspace = true
image_config.workspace = true
lib = { workspace = true, features = ["leptos"] }
axum = { workspace = true, optional = true }
cfg-if = { workspace = true }
chrono = { workspace = true }
config = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
cuid2 = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
image = { workspace = true, optional = true }
http = { workspace = true }
js-sys = { workspace = true, optional = true }
leptos = { workspace = true }
leptos_axum = { workspace = true, optional = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
log = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true, optional = true }
stylance = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true, optional = true }
tower_governor = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-wasm = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

[features]
all = ["prod", "hydrate", "ssr"]
prod = ["compression", "ratelimit"]
tracing = [] # not used
compression = ["tower-http?/compression-full"]
ratelimit = ["dep:tower_governor"]
hydrate = [
    "dep:js-sys",
    "dep:log",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:console_error_panic_hook",
    "dep:serde-wasm-bindgen",
    "dep:tracing-wasm",
    "leptos/hydrate",
]
ssr = [
    "dep:axum",
    "dep:leptos_axum",
    "dep:cornucopia",
    "dep:config",
    "dep:cuid2",
    "dep:dotenvy",
    "dep:deadpool-postgres",
    "dep:tower-http",
    "dep:tower",
    "dep:tracing-subscriber",
    "dep:image",
    "lib/pg",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptos/ssr",
    "tokio/rt-multi-thread",
]

[package.metadata.cargo-all-features]
denylist = ["axum", "tokio", "tower", "tower-http", "leptos_axum"]
skip_feature_sets = [["ssr", "hydrate"]]

[package.metadata.leptos]
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
style-bundle = true
assets-dir = "public"
site-addr = "127.0.0.1:4141"
reload-port = 4142
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
# Keep native CSS nesting in the bundle: every floor here supports it per
# Lightning CSS' compat table. Lowering a target below these re-flattens the CSS.
browserquery = "chrome >= 120, edge >= 120, firefox >= 117, safari >= 17.2, ios_saf >= 17.2, opera >= 106, samsung >= 25, and_chr >= 120"
watch = false
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

[package.metadata.stylance]
# Bundle every `*.module.css` under ./src into a single stylesheet that
# `style/main.css` imports. Class names are hashed deterministically, in
# agreement with what `stylance::import_crate_style!` resolves at compile time.
# Regenerate with `stylance .` (or `stylance --watch .` during development).
output_file = "style/stylance.css"
folders = ["./src"]
extensions = [".module.css"]
