[package]
name = "admin"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lib = { workspace = true, features = ["leptos"] }
content.workspace = true
image_config.workspace = true
anyhow = "1"
async-trait = { version = "0.1", optional = true }
axum = { workspace = true, optional = true }
axum-login = { workspace = true, optional = true }
tower-sessions = { workspace = true, optional = true }
time = { workspace = true, optional = true }
bcrypt = { workspace = true, optional = true }
cfg-if = { workspace = true }
chrono = { workspace = true }
cornucopia = { workspace = true, optional = true }
config = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
cuid2 = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
http = { workspace = true }
image = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
leptos = { workspace = true, features = ["multipart"] }
leptoslate = { workspace = true, optional = true }
leptoslate-rich = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
log = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true, optional = true }
stylance = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true, optional = true }
tower_governor = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-wasm = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4" }
web-sys = { workspace = true, optional = true }

[features]
all = ["prod", "hydrate", "ssr"]
prod = ["compression", "ratelimit"]
tracing = [] # not used
compression = ["tower-http?/compression-full"]
ratelimit = []
hydrate = [
    "dep:js-sys",
    "dep:log",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:console_error_panic_hook",
    "dep:leptoslate",
    "dep:leptoslate-rich",
    "dep:serde-wasm-bindgen",
    "dep:tracing-wasm",
    "leptos/hydrate",
]
ssr = [
    "dep:cornucopia",
    "dep:async-trait",
    "dep:axum-login",
    "dep:tower-sessions",
    "dep:time",
    "dep:axum",
    "dep:bcrypt",
    "dep:config",
    "dep:cuid2",
    "dep:dotenvy",
    "dep:deadpool-postgres",
    "dep:image",
    "dep:leptos_axum",
    "dep:tower_governor",
    "dep:tower-http",
    "dep:tower",
    "dep:tracing-subscriber",
    "lib/pg",
    "tokio/rt-multi-thread",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptos/ssr",
]

[package.metadata.cargo-all-features]
denylist = ["axum", "tokio", "tower", "tower-http", "leptos_axum"]
skip_feature_sets = [["ssr", "hydrate"]]

[package.metadata.leptos]
site-root = "target/admin"
site-pkg-dir = "pkg"
style-file = "style/main.css"
style-bundle = true
assets-dir = "public"
site-addr = "127.0.0.1:4143"
reload-port = 4444
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
# Keep native CSS nesting in the bundle: every floor here supports it per
# Lightning CSS' compat table. Lowering a target below these re-flattens the CSS.
browserquery = "chrome >= 120, edge >= 120, firefox >= 117, safari >= 17.2, ios_saf >= 17.2, opera >= 106, samsung >= 25, and_chr >= 120"
watch = false
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

[package.metadata.stylance]
# See the root `site` crate for details. Regenerate with `stylance admin`.
output_file = "style/stylance.css"
folders = ["./src"]
extensions = [".module.css"]
