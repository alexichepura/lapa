[package]
name = "lapa-e2e"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "lapa-e2e"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bcrypt = "0.19"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
playwright-rs = { version = "0.20", features = ["screenshot-diff", "trace"] }
testcontainers = "0.28"
tokio = { workspace = true, features = ["full"] }
tokio-postgres = "0.7"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
