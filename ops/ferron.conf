# Ferron 3 configuration (https://ferron.sh/docs).
# Installed to /etc/ferron/ferron.conf by ops/ferron-deploy.sh.

{
    default_http_port 80
    default_https_port 443
}

* {
    https_redirect false
    observability {
        provider "file"
        access_log "/var/log/ferron/access.log"
    }
    observability {
        provider "file"
        error_log "/var/log/ferron/error.log"
    }
}

lapa.chepura.space {
    https_redirect false
    tls {
        provider acme
        challenge http-01
        contact admin@chepura.space
        cache /var/cache/ferron-acme
    }
    proxy {
        upstream "http://127.0.0.1:8110"
    }
    observability {
        provider "file"
        access_log "/var/log/ferron/lapa-access.log"
    }
    observability {
        provider "file"
        error_log "/var/log/ferron/lapa-error.log"
    }
}

lapa-admin.chepura.space {
    https_redirect false
    tls {
        provider acme
        challenge http-01
        contact admin@chepura.space
        cache /var/cache/ferron-acme
    }
    proxy {
        upstream "http://127.0.0.1:8111"
    }
    observability {
        provider "file"
        access_log "/var/log/ferron/lapa-admin-access.log"
    }
    observability {
        provider "file"
        error_log "/var/log/ferron/lapa-admin-error.log"
    }
}
